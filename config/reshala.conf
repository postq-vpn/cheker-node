# ============================================================ #
# ==           КОНФИГУРАЦИЯ "РЕШАЛА-ФРЕЙМВОРК"             == #
# ============================================================ #
#
# Здесь лежат все настройки. Редактируй их, чтобы настроить
# "Решалу" под себя, не трогая основной код.
#

# --- Часовой пояс ---
# Всё, что Решала показывает человеку (метки замеров, время в отчётах) и
# планирует в cron, считается по Москве, а не по часовому поясу сервера:
# у VPS это почти всегда UTC, и время расходилось с настенными часами на 3 часа.
readonly RESHALA_TZ="Europe/Moscow"
# МСК = UTC+3 круглый год, перехода на лето нет — поэтому смещение можно
# держать числом и не ходить за ним в tzdata (см. censorcheck_report.sh).
readonly RESHALA_TZ_OFFSET_MIN=180

# --- Общие настройки ---
readonly LOGFILE="/var/log/reshala.log"
readonly INSTALL_PATH="/usr/local/bin/reshala"
readonly FLEET_DATABASE_FILE="${HOME}/.reshala_fleet" # Файл с базой данных серверов "Скайнета"

# --- Настройки обновления ---
# Ветка репозитория, с которой будут скачиваться обновления.
# Используй "main" для стабильной версии, "dev" для тестов.
readonly REPO_BRANCH="main"
readonly REPO_OWNER="postq-vpn"
readonly REPO_NAME="cheker-node"

# URL'ы для скачивания. Собираются автоматически, но можно и переопределить.
readonly REPO_URL="https://github.com/${REPO_OWNER}/${REPO_NAME}"
# RAW-URL для загрузки основного скрипта (для SKYNET-агента и автообновления)
# Формат raw.githubusercontent.com: /OWNER/REPO/BRANCH/path/to/file
readonly SCRIPT_URL_RAW="https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${REPO_BRANCH}/reshala.sh"
# RAW-URL установщика (install.sh) — для удалённой установки агента SKYNET
readonly INSTALLER_URL_RAW="https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${REPO_BRANCH}/install.sh"

# --- Настройки "Скайнета" ---
# Имена SSH ключей, которые будут генерироваться.
readonly SKYNET_MASTER_KEY_NAME="id_ed25519_reshala_master"
readonly SKYNET_UNIQUE_KEY_PREFIX="id_ed25519_reshala_node_"

# Дефолтные значения для добавления нового сервера.
readonly SKYNET_DEFAULT_USER="root"
readonly SKYNET_DEFAULT_PORT="22"

# --- Проверка «Блокировка ТСПУ» ---
# Режим проверки, переключается из меню [g]:
#   geo    — зонды по городам, в отчёте раздел «География блокировок» с
#            городами и операторами. Зондов больше, прогон дороже.
#   common — зонды в сетях крупных операторов, как в исходном
#            censorcheck.tlab.pw: один процент на сервер и список
#            операторов, без городов. Зондов вдвое меньше.
TSPU_CHECK_MODE="geo"

# Настройки ниже работают только в режиме geo.
# Зонды отбираются ПО ГОРОДАМ: ТСПУ ставят у оператора в конкретном регионе,
# и блокировка в Новосибирске ничего не говорит про Краснодар. Сколько зондов
# берём в городе и с какого запаса зондов город вообще попадает в выборку.
#
# Полный замер по серверу делается ОДИН раз. Промахнувшиеся зонды — и только
# они — перепроверяются двумя маленькими замерами (повтор по серверу и
# контроль по TSPU_CONTROL_IP), поэтому чистый прогон стоит ровно один замер
# на сервер: sslcert берёт 10 кредитов RIPE Atlas за каждый ответивший зонд,
# зондов в выборке = TSPU_CITY_PROBES × число городов. При 5 зондах на город
# это ~40 зондов, то есть ~400 кредитов на сервер за прогон.
#
# Порог считается только по абонентским зондам (см. TSPU_CONSUMER_ONLY): при
# 5 на сентябрь 2026 проходят 8 городов, при 4 — 11, при 3 — 15. Квота задаёт
# и шаг процента по городу: 5 зондов — 20 п.п., 3 зонда — уже 33.
TSPU_CITY_PROBES="5"
TSPU_CITY_MIN_PROBES="5"

# Своя контрольная цель для перепроверки промахов. Зонд попадёт в блокировку,
# только если промахнулся дважды и при этом дотянулся до контроля — то есть
# доказал, что жив. Отвалившийся между замерами зонд не дотянется и уйдёт из
# расчёта целиком.
#
# По умолчанию ПУСТО — тогда используется встроенный список целей, который
# перебирается до первой доступной. Список нужен из-за лимита RIPE Atlas:
# больше 25 одновременных измерений на один адрес не пускают, считая чужие,
# и на 8.8.8.8 или 1.1.1.1 этот лимит выбран всегда. Задавать своё значение
# стоит, только если есть заведомо неблокируемый зарубежный хост с TLS на
# 443, который никто больше не меряет — тогда заполни ОБА поля.
TSPU_CONTROL_IP=""
TSPU_CONTROL_SNI=""

# Строгий отбор по географии: выкидывать зонды, чьи координаты угаданы по
# GeoIP, а не заданы владельцем. География честнее, но городов остаётся 9
# вместо 12 — выпадают Казань, Уфа и Пермь.
TSPU_PROBE_STRICT_GEO="0"

# Только мобильные и домашние операторы: зонды у хостеров (Selectel, Baxet,
# Timeweb и т.п.) и в корпоративных сетях в выборку не берутся — их трафик
# идёт мимо ТСПУ и завышает доступность. Список сетей — CONSUMER_ASNS в
# modules/skynet/tspu_probe.py. Город по-прежнему попадает в выборку только
# при TSPU_CITY_MIN_PROBES абонентских зондах, поэтому городов меньше: на
# сентябрь 2026 их 8 (Москва, СПб, Новосибирск, Екатеринбург, Воронеж, Пермь,
# Ярославль, Омск). "0" — вернуть старое поведение.
TSPU_CONSUMER_ONLY="1"

# Дополнительные абонентские сети — номера ASN через запятую, без "AS".
# Например, местный домашний провайдер, которого нет во встроенном списке.
TSPU_EXTRA_ASNS=""

# Зонды на мобильном подключении (LTE/4G/5G): берутся ВСЕ, где бы ни стояли,
# сверх городской выборки и без порога города. В отчёте — свой блок
# «📱 Мобильная сеть» по каждому серверу. На сентябрь 2026 такой зонд в
# России один (Билайн, Новосибирск) — это сигнал с конкретной сети, а не
# статистика. "0" — не брать.
TSPU_MOBILE_PROBES="1"

# Серверы, исключённые из проверки ТСПУ — список имён (как в базе флота)
# через запятую, без пробелов. Управляется из меню [s]. Исключённый сервер
# не бьётся зондами RIPE Atlas и не тратит кредиты, в отчёте о нём отдельная
# строка «исключён из проверки».
TSPU_EXCLUDED_SERVERS=""

# Порог блока «Под замену» в отчёте: сервер попадает туда, только когда
# заблокирован системно — минимум в TSPU_REPLACE_CITY_SHARE% городов выборки,
# и средняя доступность по этим городам ниже TSPU_REPLACE_AVG_THRESHOLD%.
# Один просевший город сам по себе повода не даёт.
TSPU_REPLACE_CITY_SHARE="50"
TSPU_REPLACE_AVG_THRESHOLD="55"

# --- Настройки Speedtest ---
# ID сервера Ookla Speedtest по умолчанию (Beeline Moscow).
readonly SPEEDTEST_DEFAULT_SERVER_ID="16976"

# --- Автозамер вместимости флота ---
# Замер вместимости всего флота запускается сам, в фоне, при старте Решалы —
# но только если сменилась версия (было обновление) или сервер перезагружался.
# Поставь "off", чтобы запускать замер только руками из меню Skynet [p].
FLEET_CAPACITY_AUTOTEST="on"
# Метка идущего фонового замера: в ней PID процесса. Её читает дашборд, чтобы
# показать «идёт замер» вместо устаревшего числа.
readonly FLEET_CAPACITY_RUN_FILE="/tmp/reshala_fleet_capacity.run"

# --- Настройки Dashboard ---
# Максимальная ширина колонок в инфо-панели, чтобы не ехала вёрстка.
readonly DASHBOARD_LABEL_WIDTH=20
# TTL кэша основных метрик дашборда (в секундах)
readonly DASHBOARD_CACHE_TTL=60
# TTL кэша виджетов дашборда (в секундах)
# Виджеты часто ходят в сеть/докер, поэтому лучше не обновлять их слишком часто.
# 60 секунд — хороший баланс между актуальностью и нагрузкой.
readonly DASHBOARD_WIDGET_CACHE_TTL=120
SKYNET_AUTO_SSH_SCAN="on"
ENABLED_WIDGETS="04_fleet_online.sh"
TG_TOKEN=""
TG_CHAT_ID_DEFAULT=""
TG_TOPIC_ID_DEFAULT=""
DASHBOARD_LOAD_PROFILE="ultra_light"
DEBUG_MODE="off"
LAST_UPLOAD_SPEED="5"
LAST_VPN_CAPACITY="1 (Упор в Канал)"

F2B_BANTIME="60"
F2B_MAXRETRY="3"
F2B_FINDTIME="600"
