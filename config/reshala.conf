# ============================================================ #
# ==           КОНФИГУРАЦИЯ "РЕШАЛА-ФРЕЙМВОРК"             == #
# ============================================================ #
#
# Здесь лежат все настройки. Редактируй их, чтобы настроить
# "Решалу" под себя, не трогая основной код.
#

# --- Часовой пояс ---
# Всё, что Решала показывает человеку (метки замеров, время в отчётах) и
# планирует в cron, считается по Москве, а не по часовому поясу сервера:
# у VPS это почти всегда UTC, и время расходилось с настенными часами на 3 часа.
readonly RESHALA_TZ="Europe/Moscow"
# МСК = UTC+3 круглый год, перехода на лето нет — поэтому смещение можно
# держать числом и не ходить за ним в tzdata (см. censorcheck_report.sh).
readonly RESHALA_TZ_OFFSET_MIN=180

# --- Общие настройки ---
readonly LOGFILE="/var/log/reshala.log"
readonly INSTALL_PATH="/usr/local/bin/reshala"
readonly FLEET_DATABASE_FILE="${HOME}/.reshala_fleet" # Файл с базой данных серверов "Скайнета"

# --- Настройки обновления ---
# Ветка репозитория, с которой будут скачиваться обновления.
# Используй "main" для стабильной версии, "dev" для тестов.
readonly REPO_BRANCH="main"
readonly REPO_OWNER="kiloo11"
readonly REPO_NAME="Reshala-pq"

# URL'ы для скачивания. Собираются автоматически, но можно и переопределить.
readonly REPO_URL="https://github.com/${REPO_OWNER}/${REPO_NAME}"
# RAW-URL для загрузки основного скрипта (для SKYNET-агента и автообновления)
# Формат raw.githubusercontent.com: /OWNER/REPO/BRANCH/path/to/file
readonly SCRIPT_URL_RAW="https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${REPO_BRANCH}/reshala.sh"
# RAW-URL установщика (install.sh) — для удалённой установки агента SKYNET
readonly INSTALLER_URL_RAW="https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${REPO_BRANCH}/install.sh"

# --- Настройки "Скайнета" ---
# Имена SSH ключей, которые будут генерироваться.
readonly SKYNET_MASTER_KEY_NAME="id_ed25519_reshala_master"
readonly SKYNET_UNIQUE_KEY_PREFIX="id_ed25519_reshala_node_"

# Дефолтные значения для добавления нового сервера.
readonly SKYNET_DEFAULT_USER="root"
readonly SKYNET_DEFAULT_PORT="22"

# --- Проверка «Блокировка ТСПУ» ---
# Сколько замеров RIPE Atlas делать по каждому серверу за один прогон.
# Вердикт ставится по большинству: чтобы сервер попал в «Заблокировано»,
# он должен недобрать проценты минимум в двух замерах — зонды в домашних
# сетях отваливаются сами по себе, и одиночный промах это шум, а не ТСПУ.
# Меньше трёх ставить смысла нет: подтверждать промах будет нечем.
TSPU_PROBE_ROUNDS="3"

# Зонды отбираются ПО ГОРОДАМ: ТСПУ ставят у оператора в конкретном регионе,
# и блокировка в Новосибирске ничего не говорит про Краснодар. Сколько зондов
# берём в городе и с какого запаса зондов город вообще попадает в выборку.
#
# Стоимость прогона считается так: sslcert стоит 10 кредитов RIPE Atlas за
# каждый ответивший зонд, зондов в выборке = TSPU_CITY_PROBES × число городов.
# При 3 зондах на город выходит ~36 зондов, то есть ~360 кредитов на сервер
# за замер и ~1080 за прогон (TSPU_PROBE_ROUNDS замера). Плюс контрольный
# замер — ещё ~360 за раунд на весь флот сразу.
#
# Порог 5 подобран по факту: на сегодня ему удовлетворяют 12 городов (Москва,
# СПб, Новосибирск, Екатеринбург, Краснодар, Пермь, Ярославль, Омск, Томск,
# Воронеж, Казань, Уфа). Ниже 3 зондов город опускать нет смысла — один
# выпавший зонд там сразу даёт 50% «недоступности».
TSPU_CITY_PROBES="3"
TSPU_CITY_MIN_PROBES="5"

# Контрольная цель: заведомо неблокируемый зарубежный IP с TLS на 443.
# Перед каждым раундом те же зонды бьют в неё, и все, кто не достучался,
# из этого раунда выкидываются целиком — отвал зонда не должен выглядеть
# как блокировка. Цель именно зарубежная: зонд, у которого лёг весь выход
# за границу, не годится и для проверки наших серверов.
TSPU_CONTROL_IP="8.8.8.8"
TSPU_CONTROL_SNI="dns.google"

# Строгий отбор по географии: выкидывать зонды, чьи координаты угаданы по
# GeoIP, а не заданы владельцем. География честнее, но городов остаётся 9
# вместо 12 — выпадают Казань, Уфа и Пермь.
TSPU_PROBE_STRICT_GEO="0"

# --- Настройки Speedtest ---
# ID сервера Ookla Speedtest по умолчанию (Beeline Moscow).
readonly SPEEDTEST_DEFAULT_SERVER_ID="16976"

# --- Автозамер вместимости флота ---
# Замер вместимости всего флота запускается сам, в фоне, при старте Решалы —
# но только если сменилась версия (было обновление) или сервер перезагружался.
# Поставь "off", чтобы запускать замер только руками из меню Skynet [p].
FLEET_CAPACITY_AUTOTEST="on"
# Метка идущего фонового замера: в ней PID процесса. Её читает дашборд, чтобы
# показать «идёт замер» вместо устаревшего числа.
readonly FLEET_CAPACITY_RUN_FILE="/tmp/reshala_fleet_capacity.run"

# --- Настройки Dashboard ---
# Максимальная ширина колонок в инфо-панели, чтобы не ехала вёрстка.
readonly DASHBOARD_LABEL_WIDTH=20
# TTL кэша основных метрик дашборда (в секундах)
readonly DASHBOARD_CACHE_TTL=60
# TTL кэша виджетов дашборда (в секундах)
# Виджеты часто ходят в сеть/докер, поэтому лучше не обновлять их слишком часто.
# 60 секунд — хороший баланс между актуальностью и нагрузкой.
readonly DASHBOARD_WIDGET_CACHE_TTL=120
SKYNET_AUTO_SSH_SCAN="on"
ENABLED_WIDGETS="04_fleet_online.sh"
TG_TOKEN=""
TG_CHAT_ID_DEFAULT=""
TG_TOPIC_ID_DEFAULT=""
DASHBOARD_LOAD_PROFILE="ultra_light"
DEBUG_MODE="off"
LAST_UPLOAD_SPEED="5"
LAST_VPN_CAPACITY="1 (Упор в Канал)"

F2B_BANTIME="60"
F2B_MAXRETRY="3"
F2B_FINDTIME="600"
